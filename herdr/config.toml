onboarding = false

[keys]
prefix = "ctrl+b"
# Closing goes through herdr-closed-tabs, so prefix+t can reopen the tab.
close_tab = ""

[[keys.command]]
key = "prefix+space"
type = "popup"
command = "~/.local/bin/herdr-open"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+shift+x"
type = "shell"
command = "~/.local/bin/herdr-closed-tabs close"

[[keys.command]]
key = "prefix+t"
type = "shell"
command = "~/.local/bin/herdr-closed-tabs reopen"

[theme]
name = "terminal"
auto_switch = false

[theme.custom]
accent = "#00cc55"

[ui]
status_indicators = "symbols"
tab_bar_right = [{ type = "command", command = "~/.local/bin/herdr-job-status", interval_seconds = 10, timeout_seconds = 5 }]

[ui.toast]
delivery = "system"
