onboarding = false

[keys]
prefix = "ctrl+b"

[[keys.command]]
key = "prefix+space"
type = "popup"
command = "~/.local/bin/herdr-open"
width = "90%"
height = "90%"

[theme]
name = "terminal"
auto_switch = false

[theme.custom]
accent = "#00cc55"

[ui]
status_indicators = "symbols"
tab_bar_right = [{ type = "command", command = "~/.local/bin/herdr-job-status", interval_seconds = 10, timeout_seconds = 5 }]

[ui.toast]
delivery = "system"
